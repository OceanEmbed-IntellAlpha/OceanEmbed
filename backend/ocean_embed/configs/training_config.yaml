# OceanEmbed — Phase 3 training configuration (5-day smoke split)

run_name: phase3_smoke_5day

# ── Training loop ─────────────────────────────────────────
n_epochs: 50
batch_size: 2
val_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-3
weight_decay: 1.0e-4
max_grad_norm: 1.0
early_stopping_patience: 10
checkpoint_every: 5
mixed_precision: true
log_every_steps: 10
temporal_window: 1
seed: 42

# DataLoader (Windows: num_workers=0)
num_workers: 0
pin_memory: true

# ── Optimizer / scheduler ─────────────────────────────────
optimizer:
  name: AdamW
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: CosineAnnealingLR
  eta_min: 1.0e-6

# ── Model (merged with model_config.yaml at runtime) ──────
model:
  config_path: model_config.yaml

# ── Data paths (relative to repo root) ────────────────────
data:
  surface_zarr: data/processed/surface_features.zarr
  target_zarr: data/processed/target_glorys.zarr
  stats_path: data/processed/normalization_stats.json
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15

# ── Loss weights ──────────────────────────────────────────
loss:
  use_uncertainty: true
  thermocline_weight: 0.01
  thermocline_temperature: 1.0
  thermocline_use_soft_argmax: true
  depth_smooth_weight: 0.001

# Validation depth bands (metres) for logging — metrics in °C
val_depth_bands:
  ML_0-50m: [0, 50]
  thermocline_50-200m: [50, 200]
  deep_200-1000m: [200, 1000]
