# Phase 8 -- Smooth thermocline-weighted loss (Issue #21 Option A)
#
# Identical to v2 baseline (phase6_mse_only) except:
#   run_name         : phase8_thermocline_weighted
#   n_epochs         : 15
#   loss.depth_weighted : true  (activates WeightedMSELoss in train_phase8.py)
#   thermocline_weight  : 0.0  (disabled -- clean single-change experiment)
#   depth_smooth_weight : 0.0  (disabled)

batch_size: 2
checkpoint_every: 1
data:
  data_config_path: backend/ocean_embed/configs/data_config.yaml
  split_method: date_range
  stats_path: data/processed/normalization_stats_v3.json
  surface_zarr: data/processed/surface_features.zarr
  target_zarr: data/processed/target_glorys.zarr
dropout: 0.2
early_stopping_patience: 10
gradient_accumulation_steps: 4
learning_rate: 0.0005
log_every_steps: 50
loss:
  depth_weighted: true
  use_uncertainty: false
  thermocline_weight: 0.0
  thermocline_temperature: 1.0
  thermocline_use_soft_argmax: true
  depth_smooth_weight: 0.0
max_epoch_minutes: 15
max_grad_norm: 1.0
min_lr: 1.0e-06
mixed_precision: true
n_epochs: 15
num_workers: 0
optimizer:
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  name: AdamW
pin_memory: true
run_name: phase8_thermocline_weighted
scheduler:
  eta_min: 1.0e-06
  name: cosine
seed: 42
stop_if_val_rmse_epoch: 20
stop_if_val_rmse_gt: 1.5
temporal_window: 1
use_uncertainty_after_epoch: 9999
val_batch_size: 2
val_depth_bands:
  ML_0-50m:
  - 0
  - 50
  thermocline_50-200m:
  - 50
  - 200
  deep_200-1000m:
  - 200
  - 1000
warmup_epochs: 3
weight_decay: 0.0003
